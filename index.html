<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カード還元率チェッカー</title>
<meta name="theme-color" content="#2b6cb0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>カード還元率チェッカー</h1>
</header>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="search" role="tab" aria-selected="true">検索</button>
  <button class="tab-btn" data-tab="cards" role="tab" aria-selected="false">カード一覧</button>
  <button class="tab-btn" data-tab="stores" role="tab" aria-selected="false">店舗一覧</button>
</nav>

<main>
  <section id="tab-search" class="tab-panel active">
    <div class="search-box">
      <input
        id="search-input"
        type="search"
        enterkeyhint="search"
        list="store-suggestions"
        placeholder="店名やカテゴリで検索(例: セブンイレブン)"
        autocomplete="off"
      >
      <datalist id="store-suggestions"></datalist>
    </div>
    <div id="search-history" class="chip-row"></div>
    <p id="search-hint" class="hint">店名またはカテゴリを入力すると、各カードの還元率が高い順に表示されます。</p>
    <ul id="result-list" class="result-list"></ul>
  </section>

  <section id="tab-cards" class="tab-panel">
    <ul id="card-list" class="card-list"></ul>
  </section>

  <section id="tab-stores" class="tab-panel">
    <div class="search-box">
      <input
        id="store-filter-input"
        type="search"
        enterkeyhint="search"
        placeholder="店舗を絞り込む"
        autocomplete="off"
      >
    </div>
    <ul id="store-list" class="store-list"></ul>
  </section>
</main>

<script src="js/app.js"></script>
</body>
</html>

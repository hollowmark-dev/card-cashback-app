<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カード還元率チェッカー</title>
<meta name="theme-color" content="#2b6cb0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>カード還元率チェッカー</h1>
</header>

<main class="is-loading">
  <div id="loading-state" class="loading-state">
    <div class="spinner" aria-hidden="true"></div>
    <p>読み込み中...</p>
  </div>

  <section id="tab-search" class="tab-panel active">
    <div class="search-box">
      <input
        id="search-input"
        type="search"
        enterkeyhint="search"
        list="store-suggestions"
        placeholder="店名やカテゴリで検索(例: セブンイレブン)"
        autocomplete="off"
      >
      <datalist id="store-suggestions"></datalist>
    </div>
    <div id="search-history" class="chip-row"></div>
    <p id="search-hint" class="hint">店名またはカテゴリを入力すると、各カードの還元率が高い順に表示されます。</p>
    <div id="category-stores"></div>
    <ul id="result-list" class="result-list"></ul>
  </section>

  <section id="tab-cards" class="tab-panel">
    <ul id="card-list" class="card-list"></ul>
  </section>

  <section id="tab-stores" class="tab-panel">
    <div class="search-box">
      <input
        id="store-filter-input"
        type="search"
        enterkeyhint="search"
        placeholder="店舗を絞り込む"
        autocomplete="off"
      >
    </div>
    <ul id="store-list" class="store-list"></ul>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="search" role="tab" aria-selected="true">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <span>検索</span>
  </button>
  <button class="tab-btn" data-tab="cards" role="tab" aria-selected="false">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2.5"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
    <span>カード一覧</span>
  </button>
  <button class="tab-btn" data-tab="stores" role="tab" aria-selected="false">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"></path><path d="M3 9a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0"></path><path d="M5 9v10h14V9"></path></svg>
    <span>店舗一覧</span>
  </button>
</nav>

<script src="js/app.js"></script>
</body>
</html>

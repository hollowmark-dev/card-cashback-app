<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カード還元率チェッカー</title>
<meta name="theme-color" content="#2b6cb0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>カード還元率チェッカー</h1>
</header>

<main class="is-loading">
  <div id="loading-state" class="loading-state">
    <div class="spinner" aria-hidden="true"></div>
    <p>読み込み中...</p>
  </div>

  <section id="tab-search" class="tab-panel active">
    <div class="search-box">
      <input
        id="search-input"
        type="search"
        enterkeyhint="search"
        list="store-suggestions"
        placeholder="店名やカテゴリで検索(例: セブンイレブン)"
        autocomplete="off"
      >
      <datalist id="store-suggestions"></datalist>
    </div>
    <div id="search-history" class="chip-row"></div>
    <p id="search-hint" class="hint">店名またはカテゴリを入力すると、各カードの還元率が高い順に表示されます。何も入力しなければカテゴリから探せます。</p>
    <div id="category-stores"></div>
    <div id="store-category-nav"></div>
    <ul id="result-list" class="result-list"></ul>
    <ul id="store-list" class="store-list"></ul>
  </section>

  <section id="tab-cards" class="tab-panel">
    <ul id="card-list" class="card-list"></ul>
  </section>

  <section id="tab-coupons" class="tab-panel">
    <p class="hint">お店で会計する前にひと目でわかるよう、クーポンや「このお店はこのカードで◯%還元」といったお得情報を登録しておけます(福利厚生サービス等はログインが必要で自動取得できないため、手入力用です)。登録した店を検索すると自動で表示されます。</p>
    <form id="coupon-add-form" class="coupon-add-box">
      <label for="coupon-image-input" class="btn-secondary coupon-ocr-btn">
        📷 スクショから読み取る
        <input id="coupon-image-input" type="file" accept="image/*" class="visually-hidden">
      </label>
      <p id="coupon-ocr-status" class="coupon-ocr-status"></p>
      <div id="coupon-ocr-candidates"></div>
      <details id="coupon-ocr-raw" class="coupon-ocr-raw"></details>
      <input id="coupon-store-input" type="text" list="store-suggestions" placeholder="店名(例: 鎌倉パスタ)" autocomplete="off" required>
      <input id="coupon-discount-input" type="text" placeholder="内容(例: 10%引き、〇〇カードで5%還元)" autocomplete="off" required>
      <input id="coupon-card-input" type="text" list="card-suggestions" placeholder="カード名(任意、画像から読み取れなかった時だけ)" autocomplete="off">
      <datalist id="card-suggestions"></datalist>
      <input id="coupon-source-input" type="text" placeholder="入手元(任意、例: ベネフィット・ワン)" autocomplete="off">
      <button type="submit" class="btn-primary">追加</button>
    </form>
    <ul id="coupon-list" class="result-list"></ul>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="search" role="tab" aria-selected="true">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <span>検索</span>
  </button>
  <button class="tab-btn" data-tab="cards" role="tab" aria-selected="false">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2.5"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
    <span>カード一覧</span>
  </button>
  <button class="tab-btn" data-tab="coupons" role="tab" aria-selected="false">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41 12 22l-9-9V4a1 1 0 0 1 1-1h9l7.59 7.59a2 2 0 0 1 0 2.82z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
    <span>クーポン</span>
  </button>
</nav>

<script src="js/app.js"></script>
</body>
</html>

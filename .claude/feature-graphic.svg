<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b6cb0"/>
      <stop offset="100%" stop-color="#1a4971"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- アイコン(円形バッジ) -->
  <g transform="translate(120, 130)">
    <rect width="240" height="240" rx="48" fill="#ffffff"/>
    <rect x="34" y="70" width="172" height="112" rx="14" fill="#2b6cb0"/>
    <rect x="34" y="96" width="172" height="24" fill="#ffffff"/>
    <text x="120" y="168" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">%</text>
  </g>

  <!-- テキスト -->
  <g transform="translate(430, 0)">
    <text x="0" y="215" font-family="'Hiragino Sans', 'Yu Gothic', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">カード還元率</text>
    <text x="0" y="290" font-family="'Hiragino Sans', 'Yu Gothic', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">チェッカー</text>
    <text x="0" y="345" font-family="'Hiragino Sans', 'Yu Gothic', Arial, sans-serif" font-size="28" fill="#cfe3f6">そのお店で一番お得なカードが、すぐわかる。</text>
  </g>
</svg>

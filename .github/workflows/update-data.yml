name: Update card reward data

on:
  workflow_dispatch:
  schedule:
    # 毎週月曜 06:00 JST (= 日曜 21:00 UTC)
    - cron: '0 21 * * 0'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/update-data.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "chore: update card reward data"
          git push

name: Update card reward data

# scripts/update-data.js が未実装のため、現時点では手動実行のみ。
# 実装が完了したら schedule (cron) を有効にして自動収集する。
on:
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-data.js
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "chore: update card reward data"
          git push
